name: Release (catapult)

# Reusable release workflow. Apps invoke this from their own .github/workflows/
# with `uses: douglaslassance/catapult/.github/workflows/release.yml@<tag>`.
#
# The calling workflow must `secrets: inherit` when it shares this repo's owner,
# and pass each secret explicitly otherwise.
#
# Each job runs `catapult/release.sh --channels <one>` after importing the
# certificates it needs. The script is the same one used locally — the only
# difference is the cert-import prelude, which a developer's Keychain already
# has. Jobs run in parallel (homebrew + appstore, after build-s3 completes).
#
# With `platform: desktop` (Compose apps, and Tauri apps that set
# platform = "desktop"), build-desktop replaces build-s3 and builds on macOS,
# Windows and Linux, since neither jpackage nor Tauri bundles for another OS.
# Each Tauri leg writes its part of the updater manifest, and updater-manifest
# merges them into one upload once every leg succeeded.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to build (defaults to ref name when triggered by tag)"
        required: false
        type: string
        default: ""
      channels:
        description: "Comma-separated channels to run: s3,homebrew,appstore"
        required: false
        type: string
        default: "s3,homebrew"
      target:
        description: "Which of catapult.toml's [targets] to release, when it has several"
        required: false
        type: string
        default: ""
      platform:
        description: "Target platform: macos (default), ios, or desktop (Compose or Tauri on macOS, Windows and Linux)"
        required: false
        type: string
        default: "macos"
      runner:
        required: false
        type: string
        default: "macos-15"
    # Declared so a caller in another account or organization can pass them, which `secrets: inherit` cannot.
    secrets:
      APPLE_DEVELOPER_CERT:
        required: false
      APPLE_DEVELOPER_CERT_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPSTORE_CERT:
        required: false
      APPSTORE_CERT_PASSWORD:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      HOMEBREW_TAP_ACCESS_TOKEN:
        required: false
      HOMEBREW_TAP_URL:
        required: false
      INSTALLER_CERT:
        required: false
      INSTALLER_CERT_PASSWORD:
        required: false
      NOTARIZATION_ISSUER_ID:
        required: false
      NOTARIZATION_KEY:
        required: false
      NOTARIZATION_KEY_ID:
        required: false
      PROVISIONING_PROFILE_B64:
        required: false
      RELEASE_API_TOKEN:
        required: false
      RELEASE_API_URL:
        required: false
      S3_ACCESS_KEY_ID:
        required: false
      S3_ACCOUNT_ID:
        required: false
      S3_BUCKET_NAME:
        required: false
      S3_PUBLIC_URL:
        required: false
      S3_SECRET_ACCESS_KEY:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false
      SPARKLE_PUBLIC_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

env:
  CATAPULT_TARGET: ${{ inputs.target }}

jobs:
  build-s3:
    if: contains(inputs.channels, 's3') && inputs.platform != 'desktop'
    name: Build, notarize, upload (S3)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # Otherwise release.sh picks the latest of this app's tags.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_CERT: ${{ secrets.APPLE_DEVELOPER_CERT }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate_XXXXXX.p12)
          echo "$APPLE_DEVELOPER_CERT" | base64 --decode > "$CERT_FILE"
          KEYCHAIN_PATH=$(mktemp -d)/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$APPLE_DEVELOPER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_FILE"

      - name: Build, notarize, upload
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          S3_ACCOUNT_ID: ${{ secrets.S3_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RELEASE_API_URL: ${{ secrets.RELEASE_API_URL }}
          RELEASE_API_TOKEN: ${{ secrets.RELEASE_API_TOKEN }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels s3

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-s3
          path: dist/
          if-no-files-found: error

  build-desktop:
    if: contains(inputs.channels, 's3') && inputs.platform == 'desktop'
    name: Build, sign, upload (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg runs on inputs.runner so the homebrew job derives the same target triple.
        os: ["${{ inputs.runner }}", windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    outputs:
      kind: ${{ steps.cfg.outputs.kind }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners check out with CRLF, which bash cannot run.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # Otherwise release.sh picks the latest of this app's tags.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # catapult's TOML loader needs Python 3.11+, which Windows runners lack by default.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the config
        id: cfg
        run: |
          eval "$(python catapult/parse_config.py catapult.toml | tr -d '\r')"
          {
            echo "kind=${CATAPULT_BUILD_KIND:-swift}"
            echo "package_manager=${CATAPULT_BUILD_PACKAGE_MANAGER:-npm}"
            echo "linux_packages=${CATAPULT_BUILD_LINUX_PACKAGES:-}"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.cfg.outputs.kind == 'compose'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.cfg.outputs.kind == 'compose'

      # jpackage builds the .deb with dpkg-deb under fakeroot.
      - name: Install Debian packaging tools
        if: steps.cfg.outputs.kind == 'compose' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cfg.outputs.kind == 'tauri'

      - uses: oven-sh/setup-bun@v2
        if: steps.cfg.outputs.kind == 'tauri' && steps.cfg.outputs.package_manager == 'bun'

      - name: Enable pnpm and yarn
        if: steps.cfg.outputs.kind == 'tauri' && (steps.cfg.outputs.package_manager == 'pnpm' || steps.cfg.outputs.package_manager == 'yarn')
        run: corepack enable

      - name: Install Tauri's Linux dependencies
        if: steps.cfg.outputs.kind == 'tauri' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils

      - name: Install the app's Linux packages
        if: runner.os == 'Linux' && steps.cfg.outputs.linux_packages != ''
        env:
          PACKAGES: ${{ steps.cfg.outputs.linux_packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_CERT: ${{ secrets.APPLE_DEVELOPER_CERT }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate_XXXXXX.p12)
          echo "$APPLE_DEVELOPER_CERT" | base64 --decode > "$CERT_FILE"
          KEYCHAIN_PATH=$(mktemp -d)/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$APPLE_DEVELOPER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_FILE"

      - name: Build, sign, upload
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          NOTARIZATION_KEY: ${{ runner.os == 'macOS' && secrets.NOTARIZATION_KEY || '' }}
          NOTARIZATION_KEY_ID: ${{ runner.os == 'macOS' && secrets.NOTARIZATION_KEY_ID || '' }}
          NOTARIZATION_ISSUER_ID: ${{ runner.os == 'macOS' && secrets.NOTARIZATION_ISSUER_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          S3_ACCOUNT_ID: ${{ secrets.S3_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RELEASE_API_URL: ${{ secrets.RELEASE_API_URL }}
          RELEASE_API_TOKEN: ${{ secrets.RELEASE_API_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The legs run in parallel, so updater-manifest publishes the manifest once they all succeeded.
          CATAPULT_DEFER_UPDATER_MANIFEST: "1"
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels s3

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

      # A pre-release or an app without updater artifacts writes no fragment.
      - name: Save the updater manifest fragment
        if: steps.cfg.outputs.kind == 'tauri'
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.os }}
          path: dist/*.updater.json
          if-no-files-found: ignore

  updater-manifest:
    if: needs.build-desktop.outputs.kind == 'tauri'
    name: Publish the Tauri updater manifest
    needs: build-desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # Otherwise release.sh picks the latest of this app's tags.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater/
          merge-multiple: true

      - name: Merge and upload the manifest
        env:
          S3_ACCOUNT_ID: ${{ secrets.S3_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          shopt -s nullglob
          ./catapult/upload_manifest.sh "${{ steps.ver.outputs.version }}" updater/*.updater.json

  homebrew:
    # A desktop release takes the DMG from the build-desktop leg that ran on inputs.runner.
    if: >-
      !cancelled() && contains(inputs.channels, 'homebrew') &&
      (needs.build-s3.result == 'success' || needs.build-desktop.result == 'success')
    name: Homebrew cask PR
    needs: [build-s3, build-desktop]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.platform == 'desktop' && format('dist-desktop-{0}', inputs.runner) || 'dist-s3' }}
          path: dist/

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # Otherwise release.sh picks the latest of this app's tags.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Push Homebrew cask
        env:
          HOMEBREW_TAP_ACCESS_TOKEN: ${{ secrets.HOMEBREW_TAP_ACCESS_TOKEN }}
          HOMEBREW_TAP_URL: ${{ secrets.HOMEBREW_TAP_URL }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels homebrew

  appstore:
    if: contains(inputs.channels, 'appstore') && inputs.platform != 'ios' && inputs.platform != 'desktop'
    name: Build + upload (Mac App Store)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # Otherwise release.sh picks the latest of this app's tags.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import App Store certificates + provisioning profile
        env:
          APPSTORE_CERT: ${{ secrets.APPSTORE_CERT }}
          APPSTORE_CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.INSTALLER_CERT }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN_PATH=$(mktemp -d)/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          for var in APPSTORE_CERT INSTALLER_CERT; do
            pw_var="${var}_PASSWORD"
            F=$(mktemp /tmp/${var}_XXXXXX.p12)
            echo "${!var}" | base64 --decode > "$F"
            security import "$F" -P "${!pw_var}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$F"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          PROFILE_NAME=$(python3 -c "import tomllib; cfg = tomllib.load(open('catapult.toml','rb')); pp = cfg.get('build', {}).get('provisioning_profile') or f\"{cfg['app']['name']}.provisionprofile\"; print(pp.split('/')[-1])")
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$PP_DIR/$PROFILE_NAME"

      - name: Build + upload App Store
        env:
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels appstore

  appstore-ios:
    if: contains(inputs.channels, 'appstore') && inputs.platform == 'ios'
    name: Build + upload (iOS App Store / TestFlight)
    runs-on: ${{ inputs.runner }}
    steps:
      # TestFlight's What to Test lists the commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            # Otherwise release.sh picks the latest of this app's tags.
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Read the config
        id: cfg
        run: |
          eval "$(python3 catapult/parse_config.py catapult.toml)"
          {
            echo "kind=${CATAPULT_BUILD_KIND:-swift}"
            echo "package_manager=${CATAPULT_BUILD_PACKAGE_MANAGER:-npm}"
            echo "pregenerate=${CATAPULT_BUILD_PREGENERATE:-}"
          } >>"$GITHUB_OUTPUT"

      - name: Install XcodeGen
        if: contains(steps.cfg.outputs.pregenerate, 'xcodegen')
        run: command -v xcodegen >/dev/null || brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cfg.outputs.kind == 'tauri'
        with:
          targets: aarch64-apple-ios

      - uses: oven-sh/setup-bun@v2
        if: steps.cfg.outputs.kind == 'tauri' && steps.cfg.outputs.package_manager == 'bun'

      - name: Enable pnpm and yarn
        if: steps.cfg.outputs.kind == 'tauri' && (steps.cfg.outputs.package_manager == 'pnpm' || steps.cfg.outputs.package_manager == 'yarn')
        run: corepack enable

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # No certificate import: build_ios.sh archives with -allowProvisioningUpdates
      # and the App Store Connect API key, so Xcode manages the distribution cert
      # and provisioning profile itself.
      - name: Build + upload iOS App Store
        env:
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels appstore
