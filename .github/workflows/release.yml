name: Release (catapult)

# Reusable release workflow. Apps invoke this from their own .github/workflows/
# with `uses: douglaslassance/catapult/.github/workflows/release.yml@<tag>`.
#
# The calling workflow must `secrets: inherit` (or pass each secret explicitly).
#
# Each job runs `catapult/release.sh --channels <one>` after importing the
# certificates it needs. The script is the same one used locally — the only
# difference is the cert-import prelude, which a developer's Keychain already
# has. Jobs run in parallel (homebrew + appstore, after build-s3 completes).
#
# With `platform: desktop` (Compose apps), build-desktop replaces build-s3 and
# builds on macOS, Windows and Linux, since jpackage only targets its host.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to build (defaults to ref name when triggered by tag)"
        required: false
        type: string
        default: ""
      channels:
        description: "Comma-separated channels to run: s3,homebrew,appstore"
        required: false
        type: string
        default: "s3,homebrew"
      platform:
        description: "Target platform: macos (default), ios, or desktop (Compose on macOS, Windows and Linux)"
        required: false
        type: string
        default: "macos"
      runner:
        required: false
        type: string
        default: "macos-15"

jobs:
  build-s3:
    if: contains(inputs.channels, 's3') && inputs.platform != 'desktop'
    name: Build, notarize, upload (S3)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            else
              V="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_CERT: ${{ secrets.APPLE_DEVELOPER_CERT }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate_XXXXXX.p12)
          echo "$APPLE_DEVELOPER_CERT" | base64 --decode > "$CERT_FILE"
          KEYCHAIN_PATH=$(mktemp -d)/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$APPLE_DEVELOPER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_FILE"

      - name: Build, notarize, upload
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          S3_ACCOUNT_ID: ${{ secrets.S3_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels s3

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-s3
          path: dist/
          if-no-files-found: error

  build-desktop:
    if: contains(inputs.channels, 's3') && inputs.platform == 'desktop'
    name: Build, sign, upload (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg runs on inputs.runner so the homebrew job derives the same target triple.
        os: ["${{ inputs.runner }}", windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners check out with CRLF, which bash cannot run.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            else
              V="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # catapult's TOML loader needs Python 3.11+, which Windows runners lack by default.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_CERT: ${{ secrets.APPLE_DEVELOPER_CERT }}
          APPLE_DEVELOPER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERT_PASSWORD }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate_XXXXXX.p12)
          echo "$APPLE_DEVELOPER_CERT" | base64 --decode > "$CERT_FILE"
          KEYCHAIN_PATH=$(mktemp -d)/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$APPLE_DEVELOPER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_FILE"

      - name: Build, sign, upload
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          NOTARIZATION_KEY: ${{ runner.os == 'macOS' && secrets.NOTARIZATION_KEY || '' }}
          NOTARIZATION_KEY_ID: ${{ runner.os == 'macOS' && secrets.NOTARIZATION_KEY_ID || '' }}
          NOTARIZATION_ISSUER_ID: ${{ runner.os == 'macOS' && secrets.NOTARIZATION_ISSUER_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          S3_ACCOUNT_ID: ${{ secrets.S3_ACCOUNT_ID }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RELEASE_API_URL: ${{ secrets.RELEASE_API_URL }}
          RELEASE_API_TOKEN: ${{ secrets.RELEASE_API_TOKEN }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels s3

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  homebrew:
    # A desktop release takes the DMG from the build-desktop leg that ran on inputs.runner.
    if: >-
      !cancelled() && contains(inputs.channels, 'homebrew') &&
      (needs.build-s3.result == 'success' || needs.build-desktop.result == 'success')
    name: Homebrew cask PR
    needs: [build-s3, build-desktop]
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.platform == 'desktop' && format('dist-desktop-{0}', inputs.runner) || 'dist-s3' }}
          path: dist/

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            else
              V="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Push Homebrew cask
        env:
          HOMEBREW_TAP_ACCESS_TOKEN: ${{ secrets.HOMEBREW_TAP_ACCESS_TOKEN }}
          HOMEBREW_TAP_URL: ${{ secrets.HOMEBREW_TAP_URL }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels homebrew

  appstore:
    if: contains(inputs.channels, 'appstore') && inputs.platform != 'ios' && inputs.platform != 'desktop'
    name: Build + upload (Mac App Store)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            else
              V="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import App Store certificates + provisioning profile
        env:
          APPSTORE_CERT: ${{ secrets.APPSTORE_CERT }}
          APPSTORE_CERT_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          INSTALLER_CERT: ${{ secrets.INSTALLER_CERT }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD }}
          PROVISIONING_PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN_PATH=$(mktemp -d)/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          for var in APPSTORE_CERT INSTALLER_CERT; do
            pw_var="${var}_PASSWORD"
            F=$(mktemp /tmp/${var}_XXXXXX.p12)
            echo "${!var}" | base64 --decode > "$F"
            security import "$F" -P "${!pw_var}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm -f "$F"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          PROFILE_NAME=$(python3 -c "import tomllib; cfg = tomllib.load(open('catapult.toml','rb')); pp = cfg.get('build', {}).get('provisioning_profile') or f\"{cfg['app']['name']}.provisionprofile\"; print(pp.split('/')[-1])")
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$PP_DIR/$PROFILE_NAME"

      - name: Build + upload App Store
        env:
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels appstore

  appstore-ios:
    if: contains(inputs.channels, 'appstore') && inputs.platform == 'ios'
    name: Build + upload (iOS App Store / TestFlight)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              V="${GITHUB_REF#refs/tags/}"
            else
              V="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # No certificate import: build_ios.sh archives with -allowProvisioningUpdates
      # and the App Store Connect API key, so Xcode manages the distribution cert
      # and provisioning profile itself.
      - name: Build + upload iOS App Store
        env:
          NOTARIZATION_KEY: ${{ secrets.NOTARIZATION_KEY }}
          NOTARIZATION_KEY_ID: ${{ secrets.NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.NOTARIZATION_ISSUER_ID }}
        run: ./catapult/release.sh "${{ steps.ver.outputs.version }}" --channels appstore
